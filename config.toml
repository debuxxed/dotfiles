[config]
create = true
dotpath = "."

[dotfiles.d_btop]
src = "config/btop"
dst = "~/.config/btop"
chmod = "700"

[dotfiles.d_fish]
src = "config/fish"
dst = "~/.config/fish"

[dotfiles.d_yazi]
src = "config/yazi"
dst = "~/.config/yazi"

[dotfiles.d_fastfetch]
src = "config/fastfetch"
dst = "~/.config/fastfetch"
chmod = "744"

[dotfiles.d_flavours]
src = "config/flavours"
dst = "~/.config/flavours"

[dotfiles.d_micro]
src = "config/micro"
dst = "~/.config/micro"

[dotfiles.d_vesktop]
src = "config/vesktop"
dst = "~/.config/vesktop"
chmod = "700"
instignore = [
    "*",
    "!settings/",
    "!themes/",
]
upignore = [
    "*",
    "!settings/",
    "!themes/",
]
cmpignore = [
    "*",
    "!settings/",
    "!themes/",
]

[dotfiles.d_walker]
src = "config/walker"
dst = "~/.config/walker"

[dotfiles.d_quickshell]
src = "config/quickshell"
dst = "~/.config/quickshell"

[dotfiles.d_xdg-desktop-portal-termfilechooser]
src = "config/xdg-desktop-portal-termfilechooser"
dst = "~/.config/xdg-desktop-portal-termfilechooser"

[dotfiles.d_xdg-desktop-portal]
src = "config/xdg-desktop-portal"
dst = "~/.config/xdg-desktop-portal"

[dotfiles.d_waypaper]
src = "config/waypaper"
dst = "~/.config/waypaper"

[dotfiles.d_void]
src = "Pictures/wallpapers/void"
dst = "~/Pictures/wallpapers/void"

[dotfiles.d_hypr]
src = "config/hypr"
dst = "~/.config/hypr"

[profiles.offeex]
dotfiles = [
    "d_fastfetch",
    "d_micro",
    "d_btop",
    "d_fish",
    "d_yazi",
    "d_walker",
    "d_quickshell",
    "d_xdg-desktop-portal-termfilechooser",
    "d_xdg-desktop-portal",
    "d_waypaper",
    "d_void",
    "d_hypr",
]
