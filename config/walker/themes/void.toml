# [ui.anchors]
# bottom = true
# left = true
# right = true
# top = true

[ui.window]
h_align = "fill"
v_align = "fill"

[ui.window.box]
h_align = "center"
v_align = "start"
# margins = { top = 450 }
orientation = "vertical"
revert = false


# Bar
#
[ui.window.box.bar]
margins = { bottom = 12, right = 12 }

[ui.window.box.bar.entry]
h_align = "fill"
h_expand = true

[ui.window.box.bar.entry.icon]
h_align = "center"
pixel_size = 12
icon_size = 12
theme = ""


# Ai scroll
#
[ui.window.box.ai_scroll]
name = "aiScroll"
h_align = "fill"
v_align = "fill"
max_height = 300
min_width = 400
height = 300
width = 400
margins = { top = 8 }

[ui.window.box.ai_scroll.list]
name = "aiList"
orientation = "vertical"
width = 400
spacing = 10

[ui.window.box.ai_scroll.list.item]
name = "aiItem"
h_align = "fill"
v_align = "fill"
x_align = 0
y_align = 0
wrap = true


# Scroll
#
[ui.window.box.scroll.list]
marker_color = "#1BFFE1"
max_height = 300
max_width = 500
min_width = 400
width = 500
# margins = { top = 8 }

[ui.window.box.scroll.list.item.activation_label]
h_align = "fill"
v_align = "fill"
width = 0
x_align = 0.5
y_align = 0.5

[ui.window.box.scroll.list.item.icon]
pixel_size = 24
theme = ""


# Search
#
[ui.window.box.search.prompt]
name = "prompt"
icon = "edit-find"
theme = ""
pixel_size = 18
h_align = "center"
v_align = "center"

[ui.window.box.search.clear]
name = "clear"
icon = "edit-clear"
theme = ""
pixel_size = 18
h_align = "center"
v_align = "center"

[ui.window.box.search.input]
h_align = "fill"
h_expand = true
icons = true

[ui.window.box.search.spinner]
hide = true
