$fileManager = $term -e $SHELL -c yazi

# See https://wiki.hyprland.org/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# Third-party apps
bind = SUPER, F1, pass, class:^(com\.obsproject\.Studio)$
bind = SUPER, F2, pass, class:^(com\.obsproject\.Studio)$
bind = SUPER, F3, pass, class:^(com\.obsproject\.Studio)$
bind = SUPER, B, exec, brave

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod, Q, killactive
bind = $mainMod SHIFT, Q, exec, hyprctl kill
bind = $mainMod, F, fullscreen
bind = $mainMod, M, exit
bind = $mainMod, E, exec, [float; size 40% 50%] $fileManager
bind = $mainMod, SPACE, togglefloating
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, RETURN, exec, walker
bind = $mainMod, Z, exec, [float; size: 35% 40%] $term
bind = $mainMod SHIFT, Z, exec, $term
bind = $mainMod, S, togglesplit
bind = $mainMod, D, swapsplit
bind = $mainMod, L, exec, hyprlock

bind = SHIFT, F1, exec, grim -g "$(slurp -d)" - | tee ~/Pictures/screenshots/$(date +%s).png | wl-copy
bind = SHIFT, F2, exec, grim - | tee ~/Pictures/screenshots/$(date +%s).png | wl-copy

# Focus
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod, X, cyclenext,

# Move
binde = $mainMod SHIFT, left, movewindow, l
binde = $mainMod SHIFT, right, movewindow, r
binde = $mainMod SHIFT, up, movewindow, u
binde = $mainMod SHIFT, down, movewindow, d

# Resize
binde = $mainMod CTRL, left, resizeactive, -40 0
binde = $mainMod CTRL, right, resizeactive, 40 0
binde = $mainMod CTRL, up, resizeactive, 0 -40
binde = $mainMod CTRL, down, resizeactive, 0 40

# Switch workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, GRAVE, workspace, 10
bind = $mainMod ALT, up, workspace, m+1
bind = $mainMod ALT, down, workspace, m-1

# Move active window to a workspace
bind = $mainMod SHIFT, 1, movetoworkspacesilent, 1
bind = $mainMod SHIFT, 2, movetoworkspacesilent, 2
bind = $mainMod SHIFT, 3, movetoworkspacesilent, 3
bind = $mainMod SHIFT, 4, movetoworkspacesilent, 4
bind = $mainMod SHIFT, 5, movetoworkspacesilent, 5
bind = $mainMod SHIFT, 6, movetoworkspacesilent, 6
bind = $mainMod SHIFT, 7, movetoworkspacesilent, 7
bind = $mainMod SHIFT, 8, movetoworkspacesilent, 8
bind = $mainMod SHIFT, 9, movetoworkspacesilent, 9
bind = $mainMod SHIFT, GRAVE, movetoworkspacesilent, 10

# Groups
bind = $mainMod, V, togglegroup
bind = $mainMod, C, moveoutofgroup
bind = $mainMod, TAB, changegroupactive
bind = $mainMod, V, exec, $notifycmd 'Toggled Group Mode'

# Example special workspace (scratchpad)
bind = $mainMod, A, togglespecialworkspace, magic
bind = $mainMod SHIFT, A, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous
