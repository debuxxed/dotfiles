# https://wiki.hyprland.org/Configuring/Variables/#general
general {
    border_size = 1

    gaps_in = 12
    gaps_out = 36

    col.active_border = rgb(DA7890)
    col.inactive_border = rgba(00000000)
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    rounding = 0

    active_opacity = 1.0
    inactive_opacity = 1.0

    dim_special = 0.5

    shadow {
        enabled = false
    }

    # https://wiki.hyprland.org/Configuring/Variables/#blur
    blur {
        enabled = false
    }

    shadow {
    	enabled = false
    	range = 3
    	sharp = true
    	ignore_window = false
    	color = rgb(6b3844)
    	offset = 0, 1
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#animations
animations {
    enabled = true

    bezier = shake, .66,-0.5,0,1.14

    animation = global, 1, 2, default
    animation = workspaces, 1, 1, shake, slidefadevert 20%
    animation = windows, 1, 2, shake, gnomed
}

group {
	col.border_active = rgb(C1B492)
	col.border_inactive = rgb(6b634f)

	groupbar {
		enabled = true

		font_family = "VCR OSD Mono"
		font_size = 10
		indicator_height = 4
		text_color = rgb(C1B492)

		col.active = rgb(C1B492)
		col.inactive = rgb(6b634f)
	}
}
